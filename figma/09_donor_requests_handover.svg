      </g>
    
        <text x="70" y="80" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Permintaan Masuk</text>
        
      </g>
    

      <!-- Request Card -->
      <g id="RequestCard" transform="translate(24, 115)">
