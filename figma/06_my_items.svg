        <circle cx="340" cy="28" r="4" fill="#0F172A" />
        <circle cx="352" cy="28" r="4" fill="#0F172A" />
        <rect x="362" y="24" width="18" height="9" rx="3" fill="none" stroke="#0F172A" stroke-width="1.5" />
