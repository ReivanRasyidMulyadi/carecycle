        <text x="14" y="162" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" fill="#64748B">Dibutuhkan untuk adik asuh yang baru masuk SD tahun ajaran baru ini.</text>

        <!-- Actions -->
