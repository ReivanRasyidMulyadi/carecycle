name: carecycle
description: "KindShare - Platform berbagi & donasi barang layak pakai berbasis komunitas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Backend - Supabase
  supabase_flutter: ^2.6.0

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # AI - ML Kit
  google_mlkit_image_labeling: ^0.12.0

  # Certificate & Sharing
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.0.2

  # Environment
  flutter_dotenv: ^5.1.0

  # Utilities
  connectivity_plus: ^6.0.5
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.4.2
  path_provider: ^2.1.4
  file_picker: 8.1.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12

dependency_overrides:
  app_links: 6.3.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
