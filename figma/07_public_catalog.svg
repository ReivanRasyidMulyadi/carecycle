      <path d="M-7 6 L7 6 L7 20 L-7 20 Z" fill="none" stroke="#94A3B8" stroke-width="2" />
      <path d="M-4 6 L-4 3 C-4 1.5 -2.5 0 0 0 C2.5 0 4 1.5 4 3 L4 6" fill="none" stroke="#94A3B8" stroke-width="2" />
